# Los textos de la pantalla de revisión y cuánto se espera a que alguien la
# conteste. En datos porque nombran el oficio de quien revisa, y el guardián de
# vocabulario no admite eso dentro de src/.

title: "Revisión de la consulta"
intro: "Lea la nota, corrija lo que haga falta y confirme los códigos. Lo que no corrija se registra como entregado sin cambios."
confirm_label: "Correcto"
reject_label: "Quitar"
codes_heading: "Códigos propuestos"
history_heading: "Historia clínica"
transcript_heading: "Transcripción"
note_heading: "Nota"
copy_label: "Copiar"
copied_label: "Copiado"
save_label: "Guardar y cerrar"
saved_text: "Revisión guardada. Puede cerrar esta pestaña."
abandoned_text: "La revisión se cerró sin guardar: nada se registró como revisado."

# Cuánto espera el programa a que se guarde la pantalla. Si expira, la revisión
# cuenta como incompleta —igual que un corte por teclado— y no se guarda nada.
# Veinte minutos: una revisión larga con interrupciones tiene que caber, y un
# proceso olvidado no puede quedarse vivo indefinidamente.
timeout_seconds: 1200.0
