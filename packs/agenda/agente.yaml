# El agente de mensajes de la agenda (101b, demo del agente): lo que entiende y lo que dice.
# Todo el vocabulario de la conversación vive aquí, no en el código: el motor no sabe qué es
# una cita ni un mensaje. Las frases se comparan sin tildes y en minúsculas.
intents:
  "ayuda": ["ayuda", "que puedes hacer", "menu", "opciones", "hola"]
  "mis_citas": ["mis citas", "que citas tengo", "tengo cita", "mi cita", "mis turnos"]
  "disponibilidad": ["horarios libres", "hay hueco", "que horarios hay", "disponibilidad", "tienen turno", "hay turno"]
  "cancelar": ["cancelar", "anular", "ya no puedo ir", "no voy a poder", "no puedo ir"]
  "agendar": ["quiero una cita", "agendar", "reservar", "necesito turno", "sacar cita", "quisiera una cita", "quiero reservar", "cita"]
  "si": ["si", "confirmo", "ok", "vale", "dale", "claro", "correcto"]
  "no": ["no", "no gracias", "mejor no", "no quiero"]
dias:
  lunes: 0
  martes: 1
  miercoles: 2
  jueves: 3
  viernes: 4
  sabado: 5
  domingo: 6
palabras_hoy: ["hoy"]
palabras_manana: ["manana"]
umbral: 0.5
recordatorio_horas: 24
textos:
  ayuda: "Puedo agendar una cita, decirte los horarios libres, mostrar tus citas o cancelar una. ¿Qué necesitas?"
  no_entiendo: "No entendí. Escribe «cita» para agendar, «mis citas» o «cancelar»."
  pide_servicio: "¿Para qué servicio? Opciones: {servicios}."
  servicio_no: "No tengo ese servicio. Opciones: {servicios}."
  pide_dia: "¿Qué día te viene bien? Por ejemplo «mañana» o «el viernes»."
  dia_no: "No entendí el día. Dime, por ejemplo, «mañana» o «el viernes»."
  sin_huecos: "Ese día no hay huecos para {servicio}. ¿Otro día?"
  ofrece_horas: "Tengo estos horarios para {servicio} el {dia}: {horas}. ¿Cuál quieres?"
  hora_no: "Dime una de estas horas: {horas}."
  pide_nombre: "¿A nombre de quién agendo?"
  confirma: "Agendo {servicio} para {nombre}, el {dia} a las {hora}. ¿Confirmo? (sí/no)"
  agendado: "Listo, quedó agendado: {servicio}, el {dia} a las {hora}. Te escribiremos antes."
  no_agendado: "No pude agendar: {motivo}. Escribe «cita» para intentarlo otra vez."
  cancelado_no_se: "De acuerdo, no agendo nada. Escribe «cita» cuando quieras."
  sin_citas: "No tienes citas agendadas."
  linea_cita: "{dia} a las {hora}: {servicio}"
  mis_citas: "Tus citas: {citas}."
  disponibilidad: "Horarios libres para {servicio} el {dia}: {horas}."
  disponibilidad_pide_dia: "¿Para qué día? Por ejemplo «mañana» o «el viernes»."
  pide_cancelar: "¿Cancelo tu cita del {dia} a las {hora}? (sí/no)"
  sin_cita_cancelar: "No encuentro una cita tuya para cancelar."
  cancelado: "Cancelada. Gracias por avisar."
  cita_sigue: "De acuerdo, la cita sigue."
  responde_si_no: "¿Sí o no?"
  recordatorio: "Recordatorio: tienes {servicio} el {dia} a las {hora}. Si no vas, responde «cancelar»."
  post_atendida: "Gracias por venir. Si quieres volver a agendar, escribe «cita»."
  post_no_asistio: "Te echamos de menos en tu cita de hoy. Si quieres otra, escribe «cita»."
